pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'touhou_maid_construction'

includeBuild('../mc-test-harness') {
    dependencySubstitution {
        substitute module('com.mcagent.harness:mc-test-harness-api') using project(':api')
    }
}
